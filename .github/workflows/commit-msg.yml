# PR과 main 푸시마다 커밋 메시지 형식(한국어 제목·명사형 종결)을 검사한다.
name: commit-msg

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commit-msg:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$AFTER"; else range="$AFTER"; fi
          node scripts/check-commit-msg.mjs --range "$range"
